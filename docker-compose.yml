version: '3.8'

services:
  media-gallery:
    build: .
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-200}
      - SITE_NAME=${SITE_NAME:-المعرض}
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08080d">
  <meta name="description" content="معرض الوسائط - صور وفيديوهات">
  <title>MODZ Gallery</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="toast"></div>
  <header class="topbar">
    <div class="brand"><span>✦</span><div><b>MODZ</b><small>MEDIA GALLERY</small></div></div>
    <div class="actions">
      <button id="themeBtn" class="iconBtn" title="الوضع">☾</button>
      <button id="loginBtn" class="btn">دخول الإدارة</button>
      <button id="addBtn" class="btn primary hidden">+ إضافة</button>
      <button id="logoutBtn" class="btn danger hidden">خروج</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <span class="eyebrow">FIREBASE • VERCEL</span>
        <h1>معرض الوسائط</h1>
        <p>ارفع الصور والفيديوهات واحفظها بشكل دائم عبر Firebase Storage وFirestore.</p>
      </div>
      <div class="stats"><b id="count">0</b><span>ملف</span></div>
    </section>

    <section class="toolbar">
      <input id="search" placeholder="ابحث في العنوان والوصف...">
      <select id="filter">
        <option value="all">الكل</option><option value="image">صور</option><option value="video">فيديو</option>
      </select>
    </section>

    <section id="gallery" class="gallery"></section>
    <div id="empty" class="empty hidden">لا توجد وسائط حتى الآن.</div>
  </main>

  <div id="authModal" class="modal hidden">
    <div class="modalCard">
      <button class="close" data-close="authModal">×</button>
      <h2>دخول الإدارة</h2>
      <p>استخدم حساب Firebase Authentication المصرح له كمسؤول.</p>
      <input id="email" type="email" placeholder="البريد الإلكتروني">
      <input id="password" type="password" placeholder="كلمة المرور">
      <button id="doLogin" class="btn primary full">دخول</button>
      <small id="authError" class="error"></small>
    </div>
  </div>

  <div id="addModal" class="modal hidden">
    <div class="modalCard large">
      <button class="close" data-close="addModal">×</button>
      <h2>إضافة وسائط</h2>
      <div class="tabs"><button class="tab active" data-tab="upload">رفع ملف</button><button class="tab" data-tab="link">رابط</button></div>

      <div id="uploadPane">
        <input id="fileInput" type="file" accept="image/*,video/*">
        <input id="titleInput" placeholder="العنوان">
        <textarea id="descInput" placeholder="الوصف (اختياري)"></textarea>
        <button id="uploadBtn" class="btn primary full">رفع وحفظ</button>
        <div id="progressWrap" class="progress hidden"><i id="progress"></i></div>
      </div>

      <div id="linkPane" class="hidden">
        <input id="urlInput" type="url" placeholder="رابط مباشر للصورة أو الفيديو">
        <input id="linkTitle" placeholder="العنوان">
        <textarea id="linkDesc" placeholder="الوصف (اختياري)"></textarea>
        <button id="linkBtn" class="btn primary full">حفظ الرابط</button>
      </div>
    </div>
  </div>

  <div id="lightbox" class="modal hidden">
    <div class="viewer"><button class="close" data-close="lightbox">×</button><div id="viewerContent"></div><h3 id="viewerTitle"></h3><p id="viewerDesc"></p></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>

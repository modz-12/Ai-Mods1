<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="منصة أنمي وقصص مصورة وفيديوهات وأفلام">
<title>قصص الصور | Anime Library</title>
<style>
:root{
 --bg:#070711;--panel:#111122;--panel2:#17172c;--text:#f6f4ff;--muted:#a8a5bd;
 --accent:#8b5cf6;--accent2:#22d3ee;--danger:#ef4444;--border:#282844;
 --shadow:0 20px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 20% 0%,#17102e 0,#070711 38%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.app{min-height:100vh}
.topbar{height:72px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(7,7,17,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.brand{font-weight:900;font-size:20px;white-space:nowrap}
.brand span{color:var(--accent2)}
.hamburger{width:48px;height:44px;border:1px solid var(--border);border-radius:14px;background:var(--panel);color:#fff;font-size:22px}
.search{flex:1;max-width:600px;margin:auto;position:relative}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--border);background:#0e0e1c;color:#fff;padding:0 16px;outline:none}
.search input:focus{border-color:var(--accent)}
.sidebar{position:fixed;right:-310px;top:0;width:290px;height:100vh;z-index:100;background:#0c0c19;border-left:1px solid var(--border);box-shadow:var(--shadow);padding:20px;transition:.3s;overflow:auto}
.sidebar.open{right:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.overlay.show{display:block}
.side-title{font-size:22px;font-weight:900;margin:8px 0 24px}
.nav{display:grid;gap:9px}
.nav a{padding:14px;border:1px solid var(--border);background:var(--panel);border-radius:14px;display:flex;align-items:center;gap:12px;transition:.2s}
.nav a:hover,.nav a.active{border-color:var(--accent);transform:translateX(-3px);background:#18152b}
.main{max-width:1250px;margin:auto;padding:30px 18px 80px}
.hero{padding:32px;border:1px solid var(--border);background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,211,238,.08));border-radius:24px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,52px)}
.hero p{color:var(--muted);line-height:1.9;max-width:850px}
.section{margin-top:32px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-head h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:20px;overflow:hidden;min-width:0;transition:.22s;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.card:hover{transform:translateY(-5px);border-color:#5f4a9b}
.media{aspect-ratio:16/10;background:#090914;display:flex;align-items:center;justify-content:center;overflow:hidden}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.placeholder{font-size:42px;opacity:.7}
.card-body{padding:15px}
.card h3{font-size:17px;margin:0 0 8px;line-height:1.5}
.card p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 12px}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:#c9c6d8;font-size:12px}
.badge{padding:5px 8px;border-radius:999px;background:#22203a;border:1px solid var(--border)}
.btn{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,var(--accent),#6d3eea);color:#fff;font-weight:800}
.btn.secondary{background:#1b1b30;border:1px solid var(--border)}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:18px}
.modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}
.modal.show{display:flex}
.modal-box{width:min(1000px,100%);max-height:92vh;overflow:auto;background:#0d0d1b;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}
.modal-head{position:sticky;top:0;z-index:2;background:#0d0d1b;padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px}
.close{width:40px;height:40px;border:1px solid var(--border);border-radius:12px;background:#181827;color:#fff}
.detail{padding:18px}
.detail-media{background:#05050c;border-radius:18px;overflow:hidden;max-height:60vh;text-align:center}
.detail-media img,.detail-media video{max-width:100%;max-height:60vh}
.detail h2{margin-top:18px}
.detail p{color:var(--muted);line-height:1.9}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.comment-box{display:flex;gap:8px;margin-top:12px}
.comment-box input{flex:1;background:#151526;border:1px solid var(--border);color:#fff;border-radius:12px;padding:12px;outline:none}
.comments{display:grid;gap:10px;margin-top:14px}
.comment{background:#151526;border:1px solid var(--border);padding:12px;border-radius:14px}
.comment small{color:var(--muted)}
.notice{padding:12px 14px;background:#151526;border:1px solid var(--border);border-radius:14px;color:var(--muted);line-height:1.7}
footer{text-align:center;color:#77738c;padding:35px}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.topbar{height:64px}.brand{font-size:16px}.search{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.main{padding:18px 11px 60px}.hero{padding:22px;border-radius:20px}.card-body{padding:11px}.card h3{font-size:15px}.sidebar{width:280px}}
@media(max-width:420px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<button class="hamburger" id="menuBtn" aria-label="القائمة">☰</button>
<div class="brand">ANIME <span>LIBRARY</span></div>
<div class="search"><input id="searchInput" type="search" placeholder="ابحث هنا..."></div>
</header>
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<section class="hero">
<h1>🖼️ قصص الصور</h1>
<p>كل عمل له مجلد مستقل داخل <b>Gojo/img</b>. داخل مجلد العمل يوجد <b>data.js</b> والصور من 001 إلى 100، ولكل صورة أحداث وشرح خاص بها.</p>
</section>
<section class="section">
<div class="section-head"><h2>الأعمال</h2><span id="count" class="badge"></span></div>
<div id="works" class="grid"></div>
</section>
</main>
<footer>Anime Library • المحتوى منظم عبر Gojo • النظام عبر Yuta</footer>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)window.closeAnimeModal?.()">
<div class="modal-box">
<div class="modal-head"><strong id="modalTitle">التفاصيل</strong><button class="close" id="closeModal">✕</button></div>
<div id="modalContent"></div>
</div>
</div>
<script type="module">

import { pages } from "./Yuta/pages.js";
import { registerView, toggleLike, addComment, getComments, getStats } from "./Yuta/firebase.js";

const $ = (s, p=document) => p.querySelector(s);
const $$ = (s, p=document) => [...p.querySelectorAll(s)];

function setupShell(activeFile){
    const side = $("#sidebar");
    const overlay = $("#overlay");
    $("#menuBtn").addEventListener("click",()=>{side.classList.add("open");overlay.classList.add("show")});
    overlay.addEventListener("click",()=>{side.classList.remove("open");overlay.classList.remove("show")});
    const links = [...pages].sort((a,b)=>a.position-b.position).map(p=>`
        <a class="${p.file===activeFile?'active':''}" href="${p.file}">
            <span>${p.emoji}</span><strong>${escapeHtml(p.name)}</strong>
        </a>`).join("");
    side.innerHTML = `<div class="side-title">☯️ Anime Library</div><div class="nav">${links}</div>
    <div class="notice" style="margin-top:20px">المحتوى يتم تنظيمه من مجلد Gojo، بينما النظام والترتيب وقاعدة Firebase داخل Yuta.</div>`;
}
function escapeHtml(v){
    return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function searchItems(items, q){
    q=q.trim().toLowerCase();
    if(!q)return items;
    return items.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
}
function placeholder(icon="🎴"){
    return `<div class="placeholder">${icon}</div>`;
}
function imageMedia(src, alt=""){
    return src ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy" onerror="this.parentElement.innerHTML='${placeholder("🖼️")}'">` : placeholder("🖼️");
}
async function openDetail({type,item,mediaHtml,extraHtml=""}){
    const modal=$("#modal");
    $("#modalTitle").textContent=item.title||"التفاصيل";
    $("#modalContent").innerHTML=`
      <div class="detail">
        <div class="detail-media">${mediaHtml}</div>
        <h2>${escapeHtml(item.title||"بدون عنوان")}</h2>
        <p>${escapeHtml(item.description||"لا يوجد وصف.")}</p>
        ${item.events?`<div class="notice"><strong>📖 الأحداث:</strong><br>${escapeHtml(item.events)}</div>`:""}
        ${extraHtml}
        <div class="actions">
          <button class="btn" id="likeBtn">❤️ إعجاب <span id="likeCount">0</span></button>
          <span class="badge">👁️ <span id="viewCount">0</span> مشاهدة</span>
        </div>
        <h3>💬 التعليقات</h3>
        <div class="comment-box">
          <input id="commentInput" maxlength="500" placeholder="اكتب تعليقك...">
          <button class="btn" id="commentBtn">إرسال</button>
        </div>
        <div id="comments" class="comments"></div>
      </div>`;
    modal.classList.add("show");
    try{ await registerView(type,item.id); }catch{}
    try{
        const st=await getStats(type,item.id);
        $("#viewCount").textContent=st.views||0;
        $("#likeCount").textContent=st.likes||0;
    }catch{}
    $("#likeBtn").onclick=async()=>{
        try{
            const liked=await toggleLike(type,item.id);
            const st=await getStats(type,item.id);
            $("#likeCount").textContent=st.likes||0;
            $("#likeBtn").firstChild.textContent=liked?"💜 إلغاء الإعجاب ":"❤️ إعجاب ";
        }catch{ alert("تعذر تنفيذ الإعجاب. تأكد من تفعيل Anonymous Authentication في Firebase."); }
    };
    $("#commentBtn").onclick=async()=>{
        const input=$("#commentInput"), text=input.value.trim();
        if(!text)return;
        try{
            await addComment(type,item.id,text); input.value=""; await renderComments(type,item.id);
        }catch(e){alert("تعذر إضافة التعليق: "+e.message)}
    };
    await renderComments(type,item.id);
}
async function renderComments(type,id){
    const box=$("#comments"); if(!box)return;
    try{
        const comments=await getComments(type,id);
        box.innerHTML=comments.length?comments.map(c=>`<div class="comment"><div>${escapeHtml(c.text)}</div><small>عضو مجهول • ${c.createdAt?.toDate?c.createdAt.toDate().toLocaleString("ar-EG"):"الآن"}</small></div>`).join(""):`<div class="empty">لا توجد تعليقات بعد.</div>`;
    }catch{box.innerHTML=`<div class="notice">تعذر تحميل التعليقات حالياً.</div>`}
}
function closeModal(){
    $("#modal").classList.remove("show");
    $("#modalContent").innerHTML="";
}
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
export { $, $$, setupShell, escapeHtml, searchItems, imageMedia, placeholder, openDetail, closeModal };

import { imageWorks } from "./Gojo/img/index.js";
setupShell("img.html"); $("#closeModal").onclick=closeModal; window.closeAnimeModal=closeModal;
const works=$("#works"), count=$("#count");
function render(list){
 count.textContent=`${list.length} عمل`;
 works.innerHTML=list.map(w=>`<article class="card" data-id="${w.id}">
 <div class="media">${imageMedia(w.pages[0]?.image,w.title)}</div>
 <div class="card-body"><h3>${escapeHtml(w.title)}</h3><p>${escapeHtml(w.description)}</p>
 <div class="meta"><span class="badge">📄 ${w.pages.length} صفحة</span><span class="badge">📖 أحداث + شرح</span></div></div></article>`).join("");
 [...works.querySelectorAll(".card")].forEach(c=>c.onclick=()=>{
   const w=list.find(x=>x.id===c.dataset.id);
   works.innerHTML=`<div class="card" style="grid-column:1/-1"><div class="card-body">
   <h2>${escapeHtml(w.title)}</h2><p>${escapeHtml(w.description)}</p>
   <div class="grid" id="pagesGrid"></div></div></div>`;
   const pg=$("#pagesGrid");
   pg.innerHTML=w.pages.map(p=>`<article class="card"><div class="media">${imageMedia(p.image,p.title)}</div><div class="card-body"><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.description)}</p><div class="meta"><span class="badge">صفحة ${p.number}</span></div></div></article>`).join("");
   [...pg.querySelectorAll(".card")].forEach((el,i)=>el.onclick=()=>{
      const p=w.pages[i], item={id:`${w.id}-page-${p.number}`,type:"image",title:p.title,description:p.description,events:p.events,image:p.image};
      openDetail({type:"image",item,mediaHtml:imageMedia(p.image,p.title),extraHtml:`<div class="notice">📄 الصفحة ${p.number} من ${w.pages.length}</div>`});
   });
 };
}
render(imageWorks);
$("#searchInput").oninput=e=>render(searchItems(imageWorks,e.target.value));

</script>
</body>
</html>
